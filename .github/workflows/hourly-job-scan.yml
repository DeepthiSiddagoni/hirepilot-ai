name: HirePilot 5-Minute Job Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"


concurrency:
  group: hirepilot-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start HirePilot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run dev > /tmp/hirepilot.log 2>&1 &
          echo $! > /tmp/hirepilot.pid

      - name: Wait for HirePilot
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo
              echo "HirePilot is ready"
              exit 0
            fi

            sleep 2
          done

          echo "HirePilot failed to start"
          cat /tmp/hirepilot.log
          exit 1

      - name: Import Brooksource contract jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "===== BROOKSOURCE IMPORT ====="
          node scripts/import-brooksource.mjs

      - name: Import Motion Recruitment contract jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "===== MOTION RECRUITMENT IMPORT ====="
          node scripts/import-motion.mjs

      - name: Scan job sources
        run: |
          curl -fsS \
            -X POST \
            http://127.0.0.1:3000/api/scan \
            -o /tmp/scan.json

          echo "===== SCAN RESULT ====="
          cat /tmp/scan.json

      - name: Refresh verified C2C apply queue
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "===== BUILD FREE C2C/W2 QUEUE ====="
          node scripts/build-c2c-queue-from-db.mjs

          echo "===== SYNC APPLY QUEUE TO NEON ====="
          node scripts/sync-c2c-queue-to-db.mjs

      - name: Analyze newly discovered jobs
        run: |
          echo "===== ANALYZE JOBS ====="

          curl --fail --silent --show-error             -X POST             http://127.0.0.1:3000/api/analyze/jobs             -o /tmp/analyze.json

          cat /tmp/analyze.json
          echo

      - name: Verify jobs API
        run: |
          curl -fsS \
            http://127.0.0.1:3000/api/jobs \
            -o /tmp/jobs.json

          echo "===== JOB API RESPONSE ====="
          head -c 2000 /tmp/jobs.json
          echo

      - name: Server log on failure
        if: failure()
        run: cat /tmp/hirepilot.log || true
